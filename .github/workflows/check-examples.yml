name: Check educational examples

on:
  push:
    paths:
      - 'examples/**'
      - 'scripts/check_examples.py'
      - '.github/workflows/check-examples.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'examples/**'
      - 'scripts/check_examples.py'
      - '.github/workflows/check-examples.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  example-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_examples.py
