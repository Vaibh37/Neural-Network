name: Validate XOR gradients

on:
  push:
    paths:
      - 'scripts/check_xor_gradients.py'
      - 'requirements.txt'
      - '.github/workflows/check-xor-gradients.yml'
  pull_request:
    paths:
      - 'scripts/check_xor_gradients.py'
      - 'requirements.txt'
      - '.github/workflows/check-xor-gradients.yml'

permissions:
  contents: read

jobs:
  gradient-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_xor_gradients.py
