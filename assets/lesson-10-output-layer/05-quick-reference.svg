<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F5F8FC"/><rect width="1600" height="22" fill="#2563EB"/><text x="70" y="98" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start">Quick reference: forward, backward, update</text><text x="72" y="145" fill="#54647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">One training sample • linear output + squared error • no hidden-layer backprop yet</text><rect x="48" y="184" width="740" height="580" rx="24" fill="#FFFFFF" stroke="#D7E1EC" stroke-width="2"/><rect x="812" y="184" width="740" height="580" rx="24" fill="#FFFFFF" stroke="#D7E1EC" stroke-width="2"/><text x="85" y="244" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">FORWARD PASS</text><text x="88" y="305" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="500" text-anchor="start">z₁ = 1,   z₂ = -1,   z₃ = 2</text><text x="88" y="375" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="500" text-anchor="start">h = ReLU(z) = [1, 0, 2]</text><text x="88" y="445" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="500" text-anchor="start">ŷ = v · h + bₒᵤₜ = 0.8</text><text x="88" y="515" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="500" text-anchor="start">L = (ŷ − y)² = 0.04</text><line x1="87" y1="558" x2="745" y2="558" stroke="#D7E1EC" stroke-width="2" opacity="1"/><text x="88" y="618" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">GRADIENT DESCENT</text><text x="88" y="672" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="500" text-anchor="start">θ_new = θ − 0.05 × ∂L/∂θ</text><text x="88" y="718" fill="#159773" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">New ŷ = 0.92   •   New loss = 0.0064</text><text x="850" y="244" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">BACKPROPAGATION: OUTPUT LAYER</text><text x="850" y="300" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">∂L/∂ŷ = 2(ŷ − y) = −0.4</text><text x="850" y="362" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">∂ŷ/∂vᵢ = hᵢ</text><text x="850" y="424" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">∂L/∂vᵢ = (∂L/∂ŷ) × hᵢ</text><text x="850" y="486" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">dv = [−0.4, 0, −0.8]</text><text x="850" y="548" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">∂ŷ/∂bₒᵤₜ = 1</text><text x="850" y="610" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">∂L/∂bₒᵤₜ = −0.4</text><rect x="847" y="700" width="665" height="44" rx="10" fill="#EAF8F1" stroke="#B7DFCB" stroke-width="2"/><text x="1180" y="729" fill="#159773" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">HIDDEN WEIGHTS NOT UPDATED YET</text><line x1="70" y1="824" x2="1530" y2="824" stroke="#D7E1EC" stroke-width="2" opacity="1"/><text x="72" y="860" fill="#54647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">NEURAL NETWORK • LESSON 10 • ONE TRAINING EXAMPLE</text><text x="1524" y="860" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="end">05 / 05</text></svg>