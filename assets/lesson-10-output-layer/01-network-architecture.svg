 fill="#54647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">HIDDEN LAYER (ReLU)</text><text x="933" y="236" fill="#54647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">OUTPUT</text><rect x="788" y="321" width="156" height="48" rx="11" fill="#EAF2FF" stroke="#DCEAFF" stroke-width="2"/><text x="866" y="353" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle">v₁ = 0.2</text><rect x="791" y="438" width="155" height="47" rx="11" fill="#EAF2FF" stroke="#DCEAFF" stroke-width="2"/><text x="867" y="469" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle">v₂ = 0.4</text><rect x="793" y="584" width="155" height="48" rx="11" fill="#EAF2FF" stroke="#DCEAFF" stroke-width="2"/><text x="868" y="616" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle">v₃ = 0.3</text><text x="1040" y="601" fill="#54647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="middle">bₒᵤₜ = 0</text><text x="1190" y="251" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Why new weights?</text><text x="1190" y="311" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">Every connection has</text><text x="1190" y="355" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">its own trainable weight.</text><text x="1190" y="399" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">The three v weights belong</text><text x="1190" y="443" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">to the OUTPUT neuron.</text><line x1="1190" y1="485" x2="1510" y2="485" stroke="#D7E1EC" stroke-width="2" opacity="1"/><text x="1190" y="548" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start">6 hidden-layer weights</text><text x="1190" y="591" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start">3 hidden-layer biases</text><text x="1190" y="634" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start">3 output-layer weights</text><text x="1190" y="677" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start">1 output-layer bias</text><rect x="1190" y="725" width="315" height="47" rx="12" fill="#EAF8F1" stroke="#B9E8CE" stroke-width="2"/><text x="1346" y="756" fill="#159773" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">13 total parameters</text><line x1="70" y1="824" x2="1530" y2="824" stroke="#D7E1EC" stroke-width="2" opacity="1"/><text x="72" y="860" fill="#54647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">NEURAL NETWORK • LESSON 10 • ONE TRAINING EXAMPLE</text><text x="1524" y="860" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="end">01 / 05</text></svg>