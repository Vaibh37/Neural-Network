<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F5F8FC"/><rect width="1600" height="22" fill="#2563EB"/><text x="70" y="98" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start">One network, two separate sets of weights</text><text x="72" y="145" fill="#54647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Two inputs → three hidden neurons → one output neuron</text><rect x="52" y="195" width="1070" height="585" rx="24" fill="#FFFFFF" stroke="#D7E1EC" stroke-width="2"/><rect x="1160" y="195" width="388" height="585" rx="24" fill="#FFFFFF" stroke="#D7E1EC" stroke-width="2"/><line x1="236" y1="356" x2="600" y2="282" stroke="#9CB6D9" stroke-width="3" opacity="0.75"/><line x1="236" y1="356" x2="600" y2="478" stroke="#9CB6D9" stroke-width="3" opacity="0.75"/><line x1="236" y1="356" x2="600" y2="674" stroke="#9CB6D9" stroke-width="3" opacity="0.75"/><line x1="236" y1="604" x2="600" y2="282" stroke="#9CB6D9" stroke-width="3" opacity="0.75"/><line x1="236" y1="604" x2="600" y2="478" stroke="#9CB6D9" stroke-width="3" opacity="0.75"/><line x1="236" y1="604" x2="600" y2="674" stroke="#9CB6D9" stroke-width="3" opacity="0.75"/><line x1="686" y1="282" x2="995" y2="478" stroke="#80CBB8" stroke-width="4" opacity="0.9"/><line x1="686" y1="478" x2="995" y2="478" stroke="#80CBB8" stroke-width="4" opacity="0.9"/><line x1="686" y1="674" x2="995" y2="478" stroke="#80CBB8" stroke-width="4" opacity="0.9"/><circle cx="190" cy="356" r="45" fill="#FFFFFF" stroke="#2563EB" stroke-width="5"/><text x="190" y="365" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle">x₁</text><circle cx="190" cy="604" r="45" fill="#FFFFFF" stroke="#2563EB" stroke-width="5"/><text x="190" y="613" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="3