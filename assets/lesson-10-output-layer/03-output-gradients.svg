<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F5F8FC"/><rect width="1600" height="22" fill="#2563EB"/><text x="70" y="98" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start">Output-layer backpropagation: four gradients</text><text x="72" y="145" fill="#54647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Differentiate first, multiply local derivatives, then update later</text><rect x="55" y="186" width="1490" height="132" rx="20" fill="#EAF2FF" stroke="#C8DAF5" stroke-width="2"/><text x="100" y="232" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">FIRST: DIFFERENTIATE THE LOSS</text><text x="100" y="285" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="700" text-anchor="start">∂L/∂ŷ = 2(ŷ - y) = 2(0.8 - 1) = -0.4</text><rect x="55" y="343" width="1490" height="98" rx="24" fill="#FFFFFF" stroke="#D7E1EC" stroke-width="2"/><text x="84" y="382" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">OUTPUT WEIGHT v₁</text><text x="84" y="419" fill="#54647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start">∂ŷ/∂v₁ = h₁ = 1</text><text x="830" y="402" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">∂L/∂v₁ = (-0.4) × 1 = -0.4</text><rect x="55" y="458" width="1490" height="98" rx="24" fill="#FFFFFF" stroke="#D7E1EC" stroke-width="2"/><text x="84" y="497" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">OUTPUT WEIGHT v₂</text><text x="84" y="534" fill="#54647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start">∂ŷ/∂v₂ = h₂ = 0</text><text x="830" y="517" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">∂L/∂v₂ = (-0.4) × 0 = 0</text><rect x="55" y="573" width="1490" height="98" rx="24" fill="#FFFFFF" stroke="#D7E1EC" stroke-width="2"/><text x="84" y="612" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">OUTPUT WEIGHT v₃</text><text x="84" y="649" fill="#54647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start">∂ŷ/∂v₃ = h₃ = 2</text><text x="830" y="632" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">∂L/∂v₃ = (-0.4) × 2 = -0.8</text><rect x="55" y="688" width="1490" height="98" rx="24" fill="#FFFFFF" stroke="#D7E1EC" stroke-width="2"/><text x="84" y="727" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">OUTPUT BIAS bₒᵤₜ</text><text x="84" y="764" fill="#54647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start">∂ŷ/∂bₒᵤₜ = 0 + 0 + 0 + 1</text><text x="830" y="747" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">∂L/∂bₒᵤₜ = (-0.4) × 1 = -0.4</text><line x1="70" y1="824" x2="1530" y2="824" stroke="#D7E1EC" stroke-width="2" opacity="1"/><text x="72" y="860" fill="#54647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">NEURAL NETWORK • LESSON 10 • ONE TRAINING EXAMPLE</text><text x="1524" y="860" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="end">03 / 05</text></svg>