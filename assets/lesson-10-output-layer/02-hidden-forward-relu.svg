<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F5F8FC"/><rect width="1600" height="22" fill="#2563EB"/><text x="70" y="98" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start">Forward propagation: weighted sums and ReLU</text><text x="72" y="145" fill="#54647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">One XOR sample: x₁ = 1, x₂ = 0, target y = 1</text><rect x="55" y="197" width="450" height="315" rx="24" fill="#FFFFFF" stroke="#D7E1EC" stroke-width="2"/><rect x="73" y="213" width="414" height="60" rx="14" fill="#EAF2FF" stroke="none" stroke-width="2"/><text x="280" y="253" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">HIDDEN NEURON 1</text><text x="85" y="319" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">z₁ = 1(1) + 1(0) + 0</text><text x="85" y="385" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">z₁ = 1</text><rect x="84" y="425" width="389" height="62" rx="13" fill="#EAF8F1" stroke="#B4E4CD" stroke-width="2"/><text x="280" y="465" fill="#159773" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">ReLU(1) = 1</text><rect x="555" y="197" width="450" height="315" rx="24" fill="#FFFFFF" stroke="#D7E1EC" stroke-width="2"/><rect x="573" y="213" width="414" height="60" rx="14" fill="#EAF2FF" stroke="none" stroke-width="2"/><text x="780" y="253" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">HIDDEN NEURON 2</text><text x="585" y="319" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">z₂ = -1(1) + 1(0) + 0</text><text x="585" y="385" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">z₂ = -1</text><rect x="584" y="425" width="389" height="62" rx="13" fill="#EAF8F1" stroke="#B4E4CD" stroke-width="2"/><text x="780" y="465" fill="#159773" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">ReLU(-1) = 0</text><rect x="1055" y="197" width="450" height="315" rx="24" fill="#FFFFFF" stroke="#D7E1EC" stroke-width="2"/><rect x="1073" y="213" width="414" height="60" rx="14" fill="#EAF2FF" stroke="none" stroke-width="2"/><text x="1280" y="253" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">HIDDEN NEURON 3</text><text x="1085" y="319" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">z₃ = 2(1) - 1(0) + 0</text><text x="1085" y="385" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">z₃ = 2</text><rect x="1084" y="425" width="389" height="62" rx="13" fill="#EAF8F1" stroke="#B4E4CD" stroke-width="2"/><text x="1280" y="465" fill="#159773" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">ReLU(2) = 2</text><rect x="55" y="545" width="1495" height="226" rx="24" fill="#FFFFFF" stroke="#D7E1EC" stroke-width="2"/><text x="96" y="602" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">AFTER ReLU</text><text x="97" y="650" fill="#159773" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start">h = [1, 0, 2]</text><line x1="575" y1="573" x2="575" y2="745" stroke="#D7E1EC" stroke-width="3" opacity="1"/><text x="625" y="608" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">OUTPUT NEURON: NEW WEIGHTS</text><text x="625" y="658" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">ŷ = 0.2(1) + 0.4(0) + 0.3(2) + 0 = 0.8</text><text x="625" y="712" fill="#14233F" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="500" text-anchor="start">Target y = 1    •    Loss L = (0.8 - 1)² = 0.04</text><line x1="70" y1="824" x2="1530" y2="824" stroke="#D7E1EC" stroke-width="2" opacity="1"/><text x="72" y="860" fill="#54647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">NEURAL NETWORK • LESSON 10 • ONE TRAINING EXAMPLE</text><text x="1524" y="860" fill="#2563EB" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="end">02 / 05</text></svg>