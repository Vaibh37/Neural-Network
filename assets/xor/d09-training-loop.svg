<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#546579"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="2"/><rect x="62" y="56" width="84" height="10" rx="4" fill="#5146c6" stroke="#5146c6" stroke-width="2"/><text x="62" y="122" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#142239">One epoch is a full learning cycle</text><text x="64" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#546579">Train on all four examples — then update all thirteen parameters</text><line x1="62" y1="188" x2="1538" y2="188" stroke="#dfe6f0" stroke-width="2" stroke-dasharray="none"/><line x1="62" y1="824" x2="1538" y2="824" stroke="#dfe6f0" stroke-width="2" stroke-dasharray="none"/><text x="66" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#546579">XOR 2 → 3 → 1   /   NumPy from first principles</text><text x="1538" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#5146c6">DIAGRAM 09</text><rect x="80" y="276" width="310" height="165" rx="20" fill="#dbeafe" stroke="#5146c6" stroke-width="2"/><text x="102" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">1   Forward</text><text x="102" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Z_h → H → Z_o → A_o</text><rect x="472" y="276" width="310" height="165" rx="20" fill="#fff0d6" stroke="#c07a18" stroke-width="2"/><text x="494" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">2   Loss</text><text x="494" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">MSE across 4 rows</text><rect x="862" y="276" width="310" height="165" rx="20" fill="#ede9fe" stroke="#5146c6" stroke-width="2"/><text x="884" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">3   Backprop</text><text x="884" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">dW_h, db_h, dW_o, db_o</text><rect x="1250" y="276" width="270" height="165" rx="20" fill="#d7f4eb" stroke="#087f77" stroke-width="2"/><text x="1272" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">4   Update</text><text x="1272" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">θ ← θ - A × dθ</text><line x1="390" y1="359" x2="466" y2="359" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="782" y1="359" x2="856" y2="359" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="1172" y1="359" x2="1244" y2="359" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="1385" y1="452" x2="1385" y2="589" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="1385" y1="589" x2="237" y2="589" stroke="#546579" stroke-width="4" stroke-dasharray="none"/><line x1="237" y1="589" x2="237" y2="448" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="130" y="668" width="1325" height="106" rx="20" fill="#ffffff" stroke="#5146c6" stroke-width="2"/><text x="152" y="714" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">5,000 epochs  ≠  10 printed lines</text><text x="152" y="752" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">The network updates every epoch; only the progress message prints every 500.</text></svg>