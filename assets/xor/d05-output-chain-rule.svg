<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#546579"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="2"/><rect x="62" y="56" width="84" height="10" rx="4" fill="#5146c6" stroke="#5146c6" stroke-width="2"/><text x="62" y="122" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#142239">Output-layer chain rule</text><text x="64" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#546579">From MSE to the output neuron's pre-activation Z_o</text><line x1="62" y1="188" x2="1538" y2="188" stroke="#dfe6f0" stroke-width="2" stroke-dasharray="none"/><line x1="62" y1="824" x2="1538" y2="824" stroke="#dfe6f0" stroke-width="2" stroke-dasharray="none"/><text x="66" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#546579">XOR 2 → 3 → 1   /   NumPy from first principles</text><text x="1538" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#5146c6">DIAGRAM 05</text><rect x="65" y="305" width="435" height="195" rx="20" fill="#fff0d6" stroke="#c07a18" stroke-width="2"/><text x="87" y="351" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">01   Loss derivative</text><text x="87" y="389" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">dl_da_o = (2/N) × (a_o - y)</text><text x="87" y="426" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Shape (4,1)</text><rect x="580" y="305" width="435" height="195" rx="20" fill="#d7f4eb" stroke="#087f77" stroke-width="2"/><text x="602" y="351" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">02   Sigmoid derivative</text><text x="602" y="389" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">da_od_zo = a_o × (1 - a_o)</text><text x="602" y="426" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Shape (4,1)</text><rect x="1100" y="305" width="435" height="195" rx="20" fill="#ede9fe" stroke="#5146c6" stroke-width="2"/><text x="1122" y="351" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">03   Multiply</text><text x="1122" y="389" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">dl_dz_o = dl_da_o × da_od_zo</text><text x="1122" y="426" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Shape (4,1)</text><line x1="500" y1="406" x2="572" y2="406" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="1015" y1="406" x2="1092" y2="406" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="150" y="608" width="1300" height="112" rx="20" fill="#ffffff" stroke="#dfe6f0" stroke-width="2"/><text x="800" y="656" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#142239">Chain rule: dL/dZ_o = (dL/dA_o) × (dA_o/dZ_o)</text><text x="800" y="693" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#546579">The factor 2/N appears once — do not average the batch twice.</text></svg>