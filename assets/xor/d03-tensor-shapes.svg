<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#546579"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="2"/><rect x="62" y="56" width="84" height="10" rx="4" fill="#5146c6" stroke="#5146c6" stroke-width="2"/><text x="62" y="122" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#142239">Tensor shapes across the forward pass</text><text x="64" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#546579">Four examples processed together: N = 4</text><line x1="62" y1="188" x2="1538" y2="188" stroke="#dfe6f0" stroke-width="2" stroke-dasharray="none"/><line x1="62" y1="824" x2="1538" y2="824" stroke="#dfe6f0" stroke-width="2" stroke-dasharray="none"/><text x="66" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#546579">XOR 2 → 3 → 1   /   NumPy from first principles</text><text x="1538" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#5146c6">DIAGRAM 03</text><rect x="65" y="310" width="205" height="150" rx="20" fill="#dbeafe" stroke="#5146c6" stroke-width="2"/><text x="87" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">X</text><text x="87" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">4 × 2</text><text x="87" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">inputs</text><rect x="335" y="310" width="240" height="150" rx="20" fill="#ede9fe" stroke="#5146c6" stroke-width="2"/><text x="357" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">W_h / b_h</text><text x="357" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">(2 × 3) / (3,)</text><text x="357" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">broadcast bias</text><rect x="645" y="310" width="225" height="150" rx="20" fill="#ede9fe" stroke="#5146c6" stroke-width="2"/><text x="667" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Z_h → H</text><text x="667" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">4 × 3</text><text x="667" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">ReLU</text><rect x="940" y="310" width="250" height="150" rx="20" fill="#d7f4eb" stroke="#087f77" stroke-width="2"/><text x="962" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">W_o / b_o</text><text x="962" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">(3 × 1) / (1,)</text><text x="962" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">output layer</text><rect x="1250" y="310" width="285" height="150" rx="20" fill="#d7f4eb" stroke="#087f77" stroke-width="2"/><text x="1272" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Z_o → A_o</text><text x="1272" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">4 × 1</text><text x="1272" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Sigmoid</text><line x1="277" y1="385" x2="326" y2="385" stroke="#546579" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="582" y1="385" x2="636" y2="385" stroke="#546579" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="877" y1="385" x2="931" y2="385" stroke="#546579" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="1197" y1="385" x2="1241" y2="385" stroke="#546579" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="230" y="595" width="470" height="116" rx="20" fill="#ffffff" stroke="#5146c6" stroke-width="2"/><text x="252" y="641" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Matrix rule</text><text x="252" y="679" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Inner dimensions must match.</text><rect x="870" y="595" width="470" height="116" rx="20" fill="#ffffff" stroke="#087f77" stroke-width="2"/><text x="892" y="641" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Batch rule</text><text x="892" y="679" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Rows stay aligned: 4 examples.</text></svg>