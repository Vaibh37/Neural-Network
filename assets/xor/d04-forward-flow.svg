<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#546579"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="2"/><rect x="62" y="56" width="84" height="10" rx="4" fill="#5146c6" stroke="#5146c6" stroke-width="2"/><text x="62" y="122" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#142239">Forward propagation: one complete pass</text><text x="64" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#546579">Every operation transforms the same batch of four XOR examples</text><line x1="62" y1="188" x2="1538" y2="188" stroke="#dfe6f0" stroke-width="2" stroke-dasharray="none"/><line x1="62" y1="824" x2="1538" y2="824" stroke="#dfe6f0" stroke-width="2" stroke-dasharray="none"/><text x="66" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#546579">XOR 2 → 3 → 1   /   NumPy from first principles</text><text x="1538" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#5146c6">DIAGRAM 04</text><rect x="50" y="333" width="230" height="165" rx="20" fill="#dbeafe" stroke="#5146c6" stroke-width="2"/><text x="72" y="379" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">01  Weighted sum</text><text x="72" y="417" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Z_h = X @ W_h</text><text x="72" y="454" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">       + b_h</text><rect x="315" y="333" width="230" height="165" rx="20" fill="#ede9fe" stroke="#5146c6" stroke-width="2"/><text x="337" y="379" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">02  Hidden ReLU</text><text x="337" y="417" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">H = max(0, Z_h)</text><text x="337" y="454" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">shape (4,3)</text><rect x="580" y="333" width="230" height="165" rx="20" fill="#ede9fe" stroke="#5146c6" stroke-width="2"/><text x="602" y="379" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">03  Output sum</text><text x="602" y="417" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Z_o = H @ W_o</text><text x="602" y="454" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">       + b_o</text><rect x="845" y="333" width="230" height="165" rx="20" fill="#d7f4eb" stroke="#087f77" stroke-width="2"/><text x="867" y="379" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">04  Sigmoid</text><text x="867" y="417" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">A_o = σ(Z_o)</text><text x="867" y="454" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">shape (4,1)</text><rect x="1110" y="333" width="430" height="165" rx="20" fill="#fff0d6" stroke="#c07a18" stroke-width="2"/><text x="1132" y="379" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">05  Dataset error</text><text x="1132" y="417" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">L = mean((A_o - y)²)</text><text x="1132" y="454" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">one scalar MSE</text><line x1="280" y1="417" x2="310" y2="417" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="545" y1="417" x2="575" y2="417" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="810" y1="417" x2="840" y2="417" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="1075" y1="417" x2="1105" y2="417" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="180" y="615" width="575" height="119" rx="20" fill="#ffffff" stroke="#5146c6" stroke-width="2"/><text x="202" y="661" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Prediction is not training</text><text x="202" y="699" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">No weights change in forward propagation.</text><rect x="830" y="615" width="575" height="119" rx="20" fill="#ffffff" stroke="#c07a18" stroke-width="2"/><text x="852" y="661" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">The loss enables learning</text><text x="852" y="699" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Backpropagation starts from L.</text></svg>