<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#546579"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="2"/><rect x="62" y="56" width="84" height="10" rx="4" fill="#5146c6" stroke="#5146c6" stroke-width="2"/><text x="62" y="122" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#142239">Initialization — random weights, zero biases</text><text x="64" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#546579">A fixed seed reproduces an experiment; different seeds may train differently</text><line x1="62" y1="188" x2="1538" y2="188" stroke="#dfe6f0" stroke-width="2" stroke-dasharray="none"/><line x1="62" y1="824" x2="1538" y2="824" stroke="#dfe6f0" stroke-width="2" stroke-dasharray="none"/><text x="66" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#546579">XOR 2 → 3 → 1   /   NumPy from first principles</text><text x="1538" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#5146c6">DIAGRAM 10</text><rect x="80" y="274" width="685" height="306" rx="20" fill="#ede9fe" stroke="#5146c6" stroke-width="2"/><text x="102" y="320" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Hidden layer parameters</text><text x="102" y="358" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">rng = np.random.default_rng(42)</text><text x="102" y="395" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">W_h = rng.normal(0, 0.5, (2,3))</text><text x="102" y="432" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">b_h = np.zeros(3)</text><text x="102" y="469" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Different neurons need different weights.</text><rect x="835" y="274" width="685" height="306" rx="20" fill="#d7f4eb" stroke="#087f77" stroke-width="2"/><text x="857" y="320" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Output layer parameters</text><text x="857" y="358" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">W_o = rng.normal(0, 0.5, (3,1))</text><text x="857" y="395" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">b_o = np.zeros(1)</text><text x="857" y="432" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Seed fixes the starting draw.</text><text x="857" y="469" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">It does not guarantee convergence.</text><rect x="190" y="645" width="1220" height="114" rx="20" fill="#ffffff" stroke="#c07a18" stroke-width="2"/><text x="212" y="691" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Why initialize weights differently?</text><text x="212" y="729" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Identical neurons with identical weights can remain symmetric during training.</text></svg>