<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs><rect width="1400" height="800" fill="#fbfdff"/><text x="700" y="87" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" fill="#0f172a" font-weight="700">Backpropagation — Chain Rule</text><text x="700" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#475569" font-weight="400">Gradients follow the reverse path; parameter updates happen after all gradients</text><rect x="65" y="200" width="200" height="85" rx="20" fill="#fde68a" stroke="#d97706" stroke-width="3"/><text x="165" y="236.33333333333334" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">Loss L</text><text x="165" y="264.6666666666667" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">MSE</text><rect x="340" y="200" width="215" height="85" rx="20" fill="#cffafe" stroke="#0891b2" stroke-width="3"/><text x="447.5" y="236.33333333333334" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">dl_da_o</text><text x="447.5" y="264.6666666666667" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">2/N (a_o - y)</text><rect x="630" y="200" width="230" height="85" rx="20" fill="#cffafe" stroke="#0891b2" stroke-width="3"/><text x="745" y="236.33333333333334" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">dl_dz_o</text><text x="745" y="264.6666666666667" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">sigmoid derivative</text><rect x="1000" y="200" width="290" height="85" rx="20" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/><text x="1145" 