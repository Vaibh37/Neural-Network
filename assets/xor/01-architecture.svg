<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs><rect width="1400" height="800" fill="#fbfdff"/><text x="700" y="87" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" fill="#0f172a" font-weight="700">XOR Neural Network Architecture</text><text x="700" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#475569" font-weight="400">Two inputs · Three ReLU hidden neurons · One sigmoid output</text><rect x="90" y="215" width="180" height="90" rx="20" fill="#a5d8ff" stroke="#2563eb" stroke-width="3"/><text x="180" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">Input x1</text><rect x="90" y="435" width="180" height="90" rx="20" fill="#a5d8ff" stroke="#2563eb" stroke-width="3"/><text x="180" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">Input x2</text><rect x="555" y="165" width="220" height="90" rx="20" fill="#ded5ff" stroke="#7c3aed" stroke-width="3"/><text x="665" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">Hidden neuron 1</text><text x="665" y="233" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">ReLU</text><rect x="555" y="325" width="220" height="90" rx="20" fill="#ded5ff" stroke="#7c3aed" stroke-width="3"/><text x="665" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">Hidden neuron 2</text><text x="665" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">ReLU</text><rect x="555" y="485" width="220" height="90" rx="20" fill="#ded5ff" stroke="#7c3aed" stroke-width="3"/><text x="665" y="523" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">Hidden neuron 3</text><text x="665" y="553" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">ReLU</text><rect x="1040" y="325" width="240" height="90" rx="20" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/><text x="1160" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">Output neuron</text><text x="1160" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="400">Sigmoid</text><line x1="270" y1="260" x2="555" y2="210" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="270" y1="260" x2="555" y2="370" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="270" y1="260" x2="555" y2="530" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="270" y1="480" x2="555" y2="210" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="270" y1="480" x2="555" y2="370" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="270" y1="480" x2="555" y2="530" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="775" y1="210" x2="1040" y2="370" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="775" y1="370" x2="1040" y2="370" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="775" y1="530" x2="1040" y2="370" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="700" y="749" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#475569" font-weight="400">6 hidden weights + 3 hidden biases + 3 output weights + 1 output bias = 13 parameters</text></svg>