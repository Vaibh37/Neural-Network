<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#546579"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="2"/><rect x="62" y="56" width="84" height="10" rx="4" fill="#5146c6" stroke="#5146c6" stroke-width="2"/><text x="62" y="122" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#142239">Hidden-layer backpropagation</text><text x="64" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#546579">The derivative travels backward through the output weights, ReLU, and input matrix</text><line x1="62" y1="188" x2="1538" y2="188" stroke="#dfe6f0" stroke-width="2" stroke-dasharray="none"/><line x1="62" y1="824" x2="1538" y2="824" stroke="#dfe6f0" stroke-width="2" stroke-dasharray="none"/><text x="66" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#546579">XOR 2 → 3 → 1   /   NumPy from first principles</text><text x="1538" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#5146c6">DIAGRAM 07</text><rect x="50" y="310" width="360" height="175" rx="20" fill="#fff0d6" stroke="#c07a18" stroke-width="2"/><text x="72" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Incoming signal</text><text x="72" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">dl_dz_o     (4 × 1)</text><rect x="440" y="310" width="355" height="175" rx="20" fill="#dbeafe" stroke="#5146c6" stroke-width="2"/><text x="462" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Back through W_o</text><text x="462" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">dl_dh = dl_dz_o @ W_oᵀ</text><text x="462" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Result (4 × 3)</text><rect x="825" y="310" width="355" height="175" rx="20" fill="#ede9fe" stroke="#5146c6" stroke-width="2"/><text x="847" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Through ReLU</text><text x="847" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">dl_dzh = dl_dh × mask</text><text x="847" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Result (4 × 3)</text><rect x="1210" y="310" width="340" height="175" rx="20" fill="#d7f4eb" stroke="#087f77" stroke-width="2"/><text x="1232" y="356" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Hidden gradients</text><text x="1232" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">dW_h = Xᵀ @ dl_dzh</text><text x="1232" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">db_h = sum over rows</text><line x1="410" y1="394" x2="435" y2="394" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="795" y1="394" x2="820" y2="394" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="1180" y1="394" x2="1205" y2="394" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="250" y="603" width="1110" height="112" rx="20" fill="#ffffff" stroke="#c07a18" stroke-width="2"/><text x="272" y="649" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Critical distinction</text><text x="272" y="687" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Use W_oᵀ (weights), NOT dW_oᵀ (gradients), to propagate backward.</text></svg>