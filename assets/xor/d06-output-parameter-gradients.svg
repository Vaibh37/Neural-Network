<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#546579"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="2"/><rect x="62" y="56" width="84" height="10" rx="4" fill="#5146c6" stroke="#5146c6" stroke-width="2"/><text x="62" y="122" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#142239">Output weight and bias gradients</text><text x="64" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#546579">Hidden activations multiplied by output pre-activation gradients</text><line x1="62" y1="188" x2="1538" y2="188" stroke="#dfe6f0" stroke-width="2" stroke-dasharray="none"/><line x1="62" y1="824" x2="1538" y2="824" stroke="#dfe6f0" stroke-width="2" stroke-dasharray="none"/><text x="66" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#546579">XOR 2 → 3 → 1   /   NumPy from first principles</text><text x="1538" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#5146c6">DIAGRAM 06</text><rect x="85" y="268" width="445" height="235" rx="20" fill="#dbeafe" stroke="#5146c6" stroke-width="2"/><text x="107" y="314" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Hidden activations</text><text x="107" y="352" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">H shape:  (4 × 3)</text><text x="107" y="389" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Hᵀ shape: (3 × 4)</text><rect x="580" y="268" width="445" height="235" rx="20" fill="#ede9fe" stroke="#5146c6" stroke-width="2"/><text x="602" y="314" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Output signal</text><text x="602" y="352" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">dl_dz_o shape: (4 × 1)</text><text x="602" y="389" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Already contains 2/N</text><rect x="1075" y="268" width="445" height="235" rx="20" fill="#d7f4eb" stroke="#087f77" stroke-width="2"/><text x="1097" y="314" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Weight gradient</text><text x="1097" y="352" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">dW_o = Hᵀ @ dl_dz_o</text><text x="1097" y="389" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">Result shape: (3 × 1)</text><line x1="530" y1="390" x2="571" y2="390" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="1025" y1="390" x2="1066" y2="390" stroke="#546579" stroke-width="4" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="315" y="594" width="970" height="116" rx="20" fill="#fff0d6" stroke="#c07a18" stroke-width="2"/><text x="337" y="640" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142239">Output bias gradient</text><text x="337" y="678" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#546579">db_o = sum(dl_dz_o, axis=0)   →   shape (1,)</text></svg>