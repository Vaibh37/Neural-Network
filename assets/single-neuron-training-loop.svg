<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 290" role="img" aria-labelledby="title desc">
<title id="title">One linear neuron gradient descent training cycle</title>
<desc id="desc">Forward pass leads to squared loss, gradients, parameter updates and a new forward pass. Updated parameters are reused in the next loop iteration.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#516477" stroke-width="1.4"/></marker></defs>
<g font-family="Arial, sans-serif" font-size="17" fill="#1a3344" text-anchor="middle">
<rect x="20" y="93" width="165" height="98" rx="16" fill="#e5f4fb" stroke="#2382b5" stroke-width="2"/>
<text x="103" y="128" font-weight="bold">1. Predict</text><text x="103" y="155" font-size="15">y-hat = wx + b</text>
<rect x="226" y="93" width="165" height="98" rx="16" fill="#fdf2df" stroke="#bf8c28" stroke-width="2"/>
<text x="308" y="128" font-weight="bold">2. Loss</text><text x="308" y="155" font-size="15">(y-hat - y)^2</text>
<rect x="432" y="93" width="165" height="98" rx="16" fill="#f1e9fc" stroke="#9060bf" stroke-width="2"/>
<text x="514" y="128" font-weight="bold">3. Gradients</text><text x="514" y="155" font-size="15">dw and db</text>
<rect x="638" y="93" width="165" height="98" rx="16" fill="#e7f5ea" stroke="#319869" stroke-width="2"/>
<text x="720" y="128" font-weight="bold">4. Update</text><text x="720" y="155" font-size="15">w and b</text>
<rect x="844" y="93" width="155" height="98" rx="16" fill="#e5f4fb" stroke="#2382b5" stroke-width="2"/>
<text x="920" y="128" font-weight="bold">5. Check</text><text x="920" y="155" font-size="15">New loss</text>
</g>
<g fill="none" stroke="#516477" stroke-width="2.3" marker-end="url(#arrow)">
<path d="M187 141 H223"/><path d="M393 141 H429"/><path d="M599 141 H635"/><path d="M805 141 H841"/>
<path d="M923 193 V243 H100 V194"/>
</g>
<g fill="#1a3344" font-family="Arial, sans-serif" text-anchor="middle">
<text x="514" y="31" font-size="24" font-weight="bold">Gradient descent — one training step</text>
<text x="510" y="270" font-size="16">Repeat with updated w and b: the next iteration does not reset them</text>
</g>
</svg>