<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 260" role="img" aria-label="ReLU function: zero for negative inputs, y=x for nonnegative inputs"><rect width="510" height="260" fill="#f8fafc"/><text x="20" y="35" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#19343a">ReLU(z) = max(0, z)</text><path d="M35 158 H477 M261 50 V222" fill="none" stroke="#647c82" stroke-width="2"/><path d="M50 158 H261 L407 57" fill="none" stroke="#218678" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="261" cy="158" r="5" fill="#218678"/><text x="268" y="181" font-family="Arial" font-size="17" fill="#19343a">0</text><text x="410" y="58" font-family="Arial" font-size="16" fill="#218678">Positive inputs unchanged</text><text x="50" y="197" font-family="Arial" font-size="16" fill="#19343a">Negative inputs become 0</text><text x="474" y="180" font-family="Arial" font-size="18" fill="#19343a">z</text></svg>