<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#f7fafc"/><text x="640" y="78" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#102548" font-weight="700" text-anchor="middle">Derivative Rules for One Neuron</text><text x="640" y="120" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4f6384" font-weight="400" text-anchor="middle">Compute each local derivative separately</text><rect x="20" y="193" width="390" height="350" rx="18" fill="#fff" stroke="#2478d4" stroke-width="2"/><rect x="20" y="193" width="390" height="72" rx="18" fill="#dbeafe"/><text x="215" y="239" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#102548" font-weight="700" text-anchor="middle">LOSS</text><text x="215" y="320" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#172b4d" font-weight="600" text-anchor="middle">L = (a - y)^2</text><text x="215" y="387" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#123969" font-weight="600" text-anchor="middle">dL/da = 2(a - y)</text><text x="215" y="452" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172b4d" font-weight="600" text-anchor="middle">a=7, y=10 → -6</text><text x="215" y="506" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4f6384" font-weight="400" text-anchor="middle">Outer square × inner derivative.</text><rect x="445" y="193" width="390" height="350" rx="18" fill="#fff" stroke="#2478d4" stroke-width="2"/><rect x="445" y="193" width="390" height="72" rx="18" fill="#dbeafe"/><text x="640" y="239" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#102548" font-weight="700" text-anchor="middle">ACTIVATION / ReLU</text><text x="640" y="320" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#172b4d" font-weight="600" text-anchor="middle">a = max(0, z)</text><text x="640" y="387" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#123969" font-weight="600" text-anchor="middle">da/dz = 1 (z&gt;0), 0 (z&lt;0)</text><text x="640" y="452" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172b4d" font-weight="600" text-anchor="middle">z=7 → 1</text><text x="640" y="506" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4f6384" font-weight="400" text-anchor="middle">At z=0 the derivative is undefined.</text><rect x="870" y="193" width="390" height="350" rx="18" fill="#fff" stroke="#2478d4" stroke-width="2"/><rect x="870" y="193" width="390" height="72" rx="18" fill="#dbeafe"/><text x="1065" y="239" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#102548" font-weight="700" text-anchor="middle">WEIGHTED SUM</text><text x="1065" y="320" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#172b4d" font-weight="600" text-anchor="middle">z = wx + b</text><text x="1065" y="387" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#123969" font-weight="600" text-anchor="middle">dz/dw = x,     dz/db = 1</text><text x="1065" y="452" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172b4d" font-weight="600" text-anchor="middle">x=2 → 2 and 1</text><text x="1065" y="506" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4f6384" font-weight="400" text-anchor="middle">Hold the other variables fixed.</text><rect x="145" y="592" width="990" height="75" rx="16" fill="#e5f1ff" stroke="#aacbed" stroke-width="2"/><text x="640" y="638" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#123969" font-weight="700" text-anchor="middle">Local gradients:  -6   ×   1   ×   2  =  -12    (weight)</text></svg>