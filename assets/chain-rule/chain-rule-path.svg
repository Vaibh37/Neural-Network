<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#f7fafc"/><text x="640" y="78" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#102548" font-weight="700" text-anchor="middle">Where dL/dw Comes From</text><text x="640" y="120" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4f6384" font-weight="400" text-anchor="middle">The chain rule applied twice</text><rect x="85" y="164" width="1110" height="120" rx="18" fill="#e9f3ff" stroke="#b1cff1" stroke-width="2"/><text x="640" y="214" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#123969" font-weight="700" text-anchor="middle">w   →   z   →   a   →   L</text><text x="640" y="254" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4f6384" font-weight="400" text-anchor="middle">Loss depends on weight through z and a.</text><rect x="40" y="337" width="360" height="216" rx="18" fill="#fff" stroke="#2478d4" stroke-width="2"/><rect x="40" y="337" width="360" height="65" rx="18" fill="#dbeafe"/><text x="220" y="377" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#102548" font-weight="700" text-anchor="middle">STEP 1 — FIRST CHAIN RULE</text><text x="220" y="464" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172b4d" font-weight="600" text-anchor="middle">dL/dw = (dL/da) × (da/dw)</text><text x="220" y="510" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4f6384" font-weight="400" text-anchor="middle">L depends on a, which depends on w.</text><rect x="460" y="337" width="360" height="216" rx="18" fill="#fff" stroke="#2478d4" stroke-width="2"/><rect x="460" y="337" width="360" height="65" rx="18" fill="#dbeafe"/><text x="640" y="377" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#102548" font-weight="700" text-anchor="middle">STEP 2 — EXPAND da/dw</text><text x="640" y="464" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172b4d" font-weight="600" text-anchor="middle">da/dw = (da/dz) × (dz/dw)</text><text x="640" y="510" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4f6384" font-weight="400" text-anchor="middle">a depends on z, which depends on w.</text><rect x="880" y="337" width="360" height="216" rx="18" fill="#fff" stroke="#2478d4" stroke-width="2"/><rect x="880" y="337" width="360" height="65" rx="18" fill="#dbeafe"/><text x="1060" y="377" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#102548" font-weight="700" text-anchor="middle">STEP 3 — SUBSTITUTE</text><text x="1060" y="464" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">dL/dw = (dL/da) × (da/dz) × (dz/dw)</text><text x="1060" y="510" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4f6384" font-weight="400" text-anchor="middle">Multiply the local effects.</text><rect x="100" y="610" width="1080" height="68" rx="16" fill="#e9f3ff" stroke="#a2caef" stroke-width="2"/><text x="640" y="652" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#123969" font-weight="600" text-anchor="middle">The three factors are ordinary chain rule—not a new neural-network rule.</text></svg>