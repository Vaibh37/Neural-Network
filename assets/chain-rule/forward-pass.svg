<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#f7fafc"/><text x="640" y="78" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#102548" font-weight="700" text-anchor="middle">Forward Propagation — One Neuron</text><text x="640" y="120" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4f6384" font-weight="400" text-anchor="middle">Predict, activate, measure the error</text><rect x="26" y="190" width="270" height="326" rx="18" fill="#fff" stroke="#2478d4" stroke-width="2"/><rect x="26" y="190" width="270" height="70" rx="18" fill="#dbeafe"/><text x="161" y="235" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102548" font-weight="700" text-anchor="middle">INPUTS</text><text x="161" y="310" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172b4d" font-weight="500" text-anchor="middle">x = 2</text><text x="161" y="362" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172b4d" font-weight="500" text-anchor="middle">w = 3</text><text x="161" y="414" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172b4d" font-weight="500" text-anchor="middle">b = 1</text><text x="161" y="466" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172b4d" font-weight="500" text-anchor="middle">y = 10</text><rect x="346" y="190" width="270" height="326" rx="18" fill="#fff" stroke="#2478d4" stroke-width="2"/><rect x="346" y="190" width="270" height="70" rx="18" fill="#dbeafe"/><text x="481" y="235" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102548" font-weight="700" text-anchor="middle">WEIGHTED SUM</text><text x="481" y="310" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172b4d" font-weight="500" text-anchor="middle">z = wx + b</text><text x="481" y="362" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172b4d" font-weight="500" text-anchor="middle"></text><text x="481" y="414" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172b4d" font-weight="500" text-anchor="middle">3(2) + 1 = 7</text><rect x="666" y="190" width="270" height="326" rx="18" fill="#fff" stroke="#2478d4" stroke-width="2"/><rect x="666" y="190" width="270" height="70" rx="18" fill="#dbeafe"/><text x="801" y="235" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102548" font-weight="700" text-anchor="middle">ACTIVATION</text><text x="801" y="310" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172b4d" font-weight="500" text-anchor="middle">a = ReLU(z)</text><text x="801" y="362" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172b4d" font-weight="500" text-anchor="middle"></text><text x="801" y="414" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172b4d" font-weight="500" text-anchor="middle">ReLU(7) = 7</text><rect x="986" y="190" width="270" height="326" rx="18" fill="#fff" stroke="#2478d4" stroke-width="2"/><rect x="986" y="190" width="270" height="70" rx="18" fill="#dbeafe"/><text x="1121" y="235" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#102548" font-weight="700" text-anchor="middle">LOSS</text><text x="1121" y="310" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172b4d" font-weight="500" text-anchor="middle">L = (a - y)^2</text><text x="1121" y="362" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172b4d" font-weight="500" text-anchor="middle"></text><text x="1121" y="414" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172b4d" font-weight="500" text-anchor="middle">(7 - 10)^2 = 9</text><path d="M296 353 H344" stroke="#2478d4" stroke-width="5"/><path d="M331 343 L344 353 L331 363" fill="none" stroke="#2478d4" stroke-width="5"/><path d="M616 353 H664" stroke="#2478d4" stroke-width="5"/><path d="M651 343 L664 353 L651 363" fill="none" stroke="#2478d4" stroke-width="5"/><path d="M936 353 H984" stroke="#2478d4" stroke-width="5"/><path d="M971 343 L984 353 L971 363" fill="none" stroke="#2478d4" stroke-width="5"/><rect x="65" y="573" width="1150" height="95" rx="15" fill="#e5f1ff" stroke="#8bbff2" stroke-width="2"/><text x="640" y="612" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#123969" font-weight="700" text-anchor="middle">w, b, x  →  z  →  a  →  L</text><text x="640" y="646" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#4f6384" font-weight="400" text-anchor="middle">Forward pass computes a prediction and its loss. It does not update parameters.</text></svg>