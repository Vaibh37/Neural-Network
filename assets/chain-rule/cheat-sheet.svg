<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#f7fafc"/><text x="640" y="78" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#102548" font-weight="700" text-anchor="middle">One-Neuron Backpropagation Cheat Sheet</text><text x="640" y="120" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4f6384" font-weight="400" text-anchor="middle">Forward pass, local derivatives, and final gradients</text><rect x="30" y="162" width="600" height="235" rx="18" fill="#fff" stroke="#2478d4" stroke-width="2"/><text x="330" y="210" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#123969" font-weight="700" text-anchor="middle">FORWARD PASS</text><text x="330" y="269" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#172b4d" font-weight="500" text-anchor="middle">z = wx + b</text><text x="330" y="319" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#172b4d" font-weight="500" text-anchor="middle">a = ReLU(z)</text><text x="330" y="369" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#172b4d" font-weight="500" text-anchor="middle">L = (a - y)^2</text><rect x="650" y="162" width="600" height="235" rx="18" fill="#fff" stroke="#2478d4" stroke-width="2"/><text x="950" y="210" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#123969" font-weight="700" text-anchor="middle">LOCAL DERIVATIVES</text><text x="950" y="257" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172b4d" font-weight="500" text-anchor="middle">dL/da = 2(a - y)</text><text x="950" y="299" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172b4d" font-weight="500" text-anchor="middle">da/dz = 1 if z&gt;0, else 0 if z&lt;0</text><text x="950" y="341" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172b4d" font-weight="500" text-anchor="middle">dz/dw = x,    dz/db = 1</text><text x="950" y="377" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4f6384" font-weight="500" text-anchor="middle">ReLU' at z=0: undefined</text><rect x="30" y="418" width="600" height="210" rx="18" fill="#fff" stroke="#2478d4" stroke-width="2"/><text x="330" y="466" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#123969" font-weight="700" text-anchor="middle">CHAIN RULE</text><text x="330" y="520" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172b4d" font-weight="500" text-anchor="middle">dL/dw = (dL/da) × (da/dz) × (dz/dw)</text><text x="330" y="572" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172b4d" font-weight="500" text-anchor="middle">dL/db = (dL/da) × (da/dz) × (dz/db)</text><rect x="650" y="418" width="600" height="210" rx="18" fill="#fff" stroke="#2478d4" stroke-width="2"/><text x="950" y="466" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#123969" font-weight="700" text-anchor="middle">WORKED EXAMPLE</text><text x="950" y="510" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172b4d" font-weight="500" text-anchor="middle">x=2, w=3, b=1, y=10</text><text x="950" y="548" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172b4d" font-weight="500" text-anchor="middle">z=7, a=7, L=9</text><text x="950" y="589" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1452a1" font-weight="700" text-anchor="middle">dL/dw = -12,  dL/db = -6</text><text x="640" y="678" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4f6384" font-weight="500" text-anchor="middle">Backpropagation computes gradients. Gradient descent uses them to update parameters.</text></svg>