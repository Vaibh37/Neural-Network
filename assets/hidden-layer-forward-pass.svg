<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 370" role="img" aria-label="One dense hidden layer: input vector, weighted sum and bias, ReLU activation, outputs to next layer"><rect width="990" height="370" fill="#f8fafc"/><text x="32" y="47" fill="#17343a" font-family="Arial,sans-serif" font-size="29" font-weight="700">Inside one dense hidden layer</text><text x="32" y="82" fill="#45616a" font-family="Arial,sans-serif" font-size="20">The same neurons calculate Wx + b and apply ReLU.</text><g font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#19343a"><rect x="30" y="129" rx="16" width="180" height="129" fill="#e7f0fa" stroke="#5482b7" stroke-width="2"/><text x="120" y="161" font-size="18" font-weight="700">INPUT</text><text x="120" y="195">x = [3, 4]</text><text x="120" y="225" font-size="15">2 input values</text><rect x="265" y="129" rx="16" width="210" height="129" fill="#e5f6f1" stroke="#218678" stroke-width="2"/><text x="370" y="161" font-size="18" font-weight="700">WEIGHTED SUM</text><text x="370" y="193">Z = Wx + b</text><text x="370" y="226" font-size="17">Z = [3, -1]</text><rect x="530" y="129" rx="16" width="167" height="129" fill="#e5f6f1" stroke="#218678" stroke-width="2"/><text x="614" y="161" font-size="18" font-weight="700">ACTIVATION</text><text x="614" y="195">ReLU(Z)</text><text x="614" y="225" font-size="16">Negatives → 0</text><rect x="749" y="129" rx="16" width="208" height="129" fill="#fff0df" stroke="#c48a33" stroke-width="2"/><text x="853" y="161" font-size="18" font-weight="700">HIDDEN OUTPUT</text><text x="853" y="195">A = [3, 0]</text><text x="853" y="225" font-size="16">To the next layer</text></g><g fill="#218678" stroke="#218678" stroke-width="3"><path d="M215 195 H256"/><path d="M249 188 L257 195 L249 202" fill="none"/><path d="M480 195 H522"/><path d="M515 188 L523 195 L515 202" fill="none"/><path d="M701 195 H740"/><path d="M733 188 L741 195 L733 202" fill="none"/></g><text x="32" y="298" fill="#17343a" font-family="Arial,sans-serif" font-size="19">Neuron 1: (2 × 3) + (-1 × 4) + 1 = 3 → ReLU(3) = 3</text><text x="32" y="329" fill="#17343a" font-family="Arial,sans-serif" font-size="19">Neuron 2: (-1 × 3) + (1 × 4) - 2 = -1 → ReLU(-1) = 0</text></svg>